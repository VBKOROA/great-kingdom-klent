# Evaluation workload: one model pair alongside training on a 24 GB GPU.
# Conservative starting point; benchmark arena time and training slowdown.
games: 60
batch_size: 16
max_turns: 112
device: cuda
# Per-game pending leaf cap: up to 16 * 16 rows per search wave,
# split between the two models. Actual batches may be smaller.
leaf_batch_size: 16

# Gumbel search
gumbel_simulations: 32
gumbel_max_considered_actions: 8
gumbel_c_visit: 50.0
gumbel_c_scale: 1.0
gumbel_scale: 0.0

# Opening exploration
opening_gumbel_turns: 8
opening_gumbel_scale: 1.0

# Policy target
policy_target_c_visit: 50.0
policy_target_c_scale: 1.0
policy_target_temperature: 1.0

# Fairness and promotion
paired_seeds: true
promotion_threshold: 0.5
require_side_win_rates_for_promotion: true
